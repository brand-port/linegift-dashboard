<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>LINEギフト 売上ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{--navy:#1A2B5C;--green:#06C755;--bg:#f4f6fa;--card:#fff;--muted:#7a869a;--line:#e7ebf2;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg);color:#1c2533}
  header{background:var(--navy);color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  header h1{font-size:18px;font-weight:700;letter-spacing:.02em}
  header h1 .badge{background:var(--green);font-size:11px;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle}
  .updated{font-size:12px;color:#c3ccde}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 1px 3px rgba(20,40,80,.04)}
  .card .label{font-size:12px;color:var(--muted);font-weight:600}
  .card .value{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.01em}
  .card .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .card.accent{background:var(--navy);color:#fff}
  .card.accent .label,.card.accent .sub{color:#c3ccde}
  .grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .panel h2{font-size:14px;font-weight:700;margin-bottom:12px;color:#2b3a55}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .foot{font-size:11px;color:var(--muted);margin-top:18px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>LINEギフト 売上ダッシュボード<span class="badge">fuuz</span></h1>
  <div class="updated" id="updated">読み込み中…</div>
</header>
<div class="wrap">
  <div class="kpis" id="kpis"></div>
  <div class="grid">
    <div>
      <div class="panel"><h2>日次GMV推移（直近30日・取引完了）</h2><canvas id="gmvChart" height="120"></canvas></div>
      <div class="panel"><h2>日次 取引完了件数（直近30日）</h2><canvas id="cntChart" height="90"></canvas></div>
    </div>
    <div>
      <div class="panel"><h2>ステータス別 内訳（全期間）</h2><canvas id="statusChart" height="200"></canvas></div>
      <div class="panel"><h2>取引中止 理由</h2><table id="cancelTbl"><tbody></tbody></table></div>
    </div>
  </div>
  <div class="foot">15分ごとに自動更新 / 出典: LINE GIFT Shop API / fuuz社内用</div>
</div>
<script>
const yen = n => "¥" + (n||0).toLocaleString("ja-JP");
const num = n => (n||0).toLocaleString("ja-JP");

function kpiCard(label,value,sub,accent){
  return `<div class="card ${accent?'accent':''}"><div class="label">${label}</div>`+
         `<div class="value">${value}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
}

async function load(){
  const res = await fetch("data.json?t=" + Date.now());
  const d = await res.json();
  document.getElementById("updated").textContent = "最終更新: " + d.updated_at;
  const k = d.kpi;
  document.getElementById("kpis").innerHTML =
    kpiCard("今月 GMV(売上)", yen(k.month_gmv), `${num(k.month_count)}件 / 客単価 ${yen(k.month_aov)}`, true) +
    kpiCard("今日 GMV", yen(k.today_gmv), `${num(k.today_count)}件`) +
    kpiCard("パイプライン(処理中)", num(k.pipeline_count)+"件", `見込 ${yen(k.pipeline_amount)}`) +
    kpiCard("今月 取引中止", num(k.cancel_month)+"件", "失注") +
    kpiCard("全期間 GMV(蓄積)", yen(k.total_gmv), `${num(k.total_count)}件`);

  const labels = d.daily.map(x=>x.date);
  new Chart(gmvChart,{type:"line",data:{labels,datasets:[{data:d.daily.map(x=>x.gmv),
    borderColor:"#06C755",backgroundColor:"rgba(6,199,85,.12)",fill:true,tension:.3,pointRadius:2}]},
    options:{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>"¥"+v.toLocaleString()}}}}});
  new Chart(cntChart,{type:"bar",data:{labels,datasets:[{data:d.daily.map(x=>x.count),
    backgroundColor:"#1A2B5C"}]},options:{plugins:{legend:{display:false}},scales:{y:{ticks:{precision:0}}}}});
  new Chart(statusChart,{type:"doughnut",data:{labels:d.status.map(s=>s.label),
    datasets:[{data:d.status.map(s=>s.count),
    backgroundColor:["#06C755","#1A2B5C","#f5a623","#e0245e","#9aa7bd","#6c5ce7"]}]},
    options:{plugins:{legend:{position:"right"}}}});

  const tb = document.querySelector("#cancelTbl tbody");
  tb.innerHTML = "<tr><th>理由</th><th class='num'>件数</th></tr>" +
    (d.cancel_reasons.length ? d.cancel_reasons.map(r=>
      `<tr><td>${r.reason}</td><td class="num">${r.count}</td></tr>`).join("")
      : "<tr><td colspan=2 style='color:#7a869a'>取引中止なし</td></tr>");
}
load();
setTimeout(()=>location.reload(), 15*60*1000); // 15分ごとに再読込
</script>
</body>
</html>
